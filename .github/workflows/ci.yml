name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` needs a committed package-lock.json. If your repo has none yet,
      # use `npm install` instead (and commit the lockfile afterwards).
      - name: Install dependencies
        run: npm ci

      # Generates @prisma/client so the API typecheck passes.
      - name: Generate Prisma client
        run: npm run db:generate -w @mea/api

      - name: Typecheck API
        run: npm run typecheck -w @mea/api

      - name: Typecheck web
        run: npm run typecheck -w @mea/web

      - name: Build web
        run: npm run build -w @mea/web

      # The web test suite (vitest) — no database required.
      - name: Run web tests
        run: npm test -w @mea/web
